name: AdminOnlyLoginIP
version: '1.0'
main: com.adminonlyloginip.AdminOnlyLoginIP
api-version: '1.20'
description: Restricts login to saved UUID+IP pairs

commands:
  adminonlyloginip:
    description: Add or delete admin IP entry
    usage: /AdminOnlyLoginIP add|delete <nickname>
    aliases: [aoli]

permissions:
  adminonlyloginip.admin:
    description: Allows managing IP entries
    default: op
